<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyecto NFC</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="app">

    <!-- INTRO -->
    <section id="intro" class="screen">
        <h1>PROYECTO L-01</h1>
        <p>NFC detectada ✔</p>
        <p>Iniciando experiencia...</p>

        <button onclick="startGame()">
            Comenzar
        </button>
    </section>


    <!-- NIVEL 1 -->
    <section id="level1" class="screen hidden">

        <h2>NIVEL 1</h2>

        <p>
            Encuentra el orden correcto
        </p>

        <div id="grid"></div>

    </section>


    <!-- NIVEL 2 -->
    <section id="level2" class="screen hidden">

        <h2>NIVEL 2</h2>

        <p>
            Segundo desafío
        </p>

        <div id="puzzle2"></div>

    </section>


    <!-- NIVEL 3 -->
    <section id="level3" class="screen hidden">

        <h2>NIVEL 3</h2>

        <p>
            Última prueba
        </p>

        <div id="puzzle3"></div>

    </section>


    <!-- FINAL -->
    <section id="final" class="screen hidden">

        <h1>❤️</h1>

        <h2>Lo conseguiste</h2>

        <p>
            Has completado el proyecto.
        </p>

        <p>
            Siempre tú.
        </p>

    </section>


</div>


<script src="script.js"></script>

</body>
</html>
